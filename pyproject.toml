[project]
name = "comfyui-skillprompt"
version = "1.0.0"
description = "Write prompts from a markdown rulebook: an OpenAI-compatible LLM rewrites your idea into a structured positive prompt, plus a deterministic Layout compiler. Endpoints live in skillprompt.ini."
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []
readme = "README.md"
keywords = ["comfyui", "prompt", "llm", "skill", "layout", "qwen", "anime"]

[project.urls]
Repository = "https://github.com/Tsukihuyu/ComfyUI_SkillPrompt"
Issues = "https://github.com/Tsukihuyu/ComfyUI_SkillPrompt/issues"

# PublisherId must exist on registry.comfy.org before publishing.
[tool.comfy]
PublisherId = "chiduki-huyu"
DisplayName = "SkillPrompt"
Icon = ""
